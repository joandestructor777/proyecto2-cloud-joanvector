name: Cloud Frontend Deployment (HU-12)

on:
  push:
    branches: [ main, development ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Publish Cloud SPA (HTTPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production SPA Bundle
        env:
          VITE_API_URL: https://proyecto2-cloud-joanvector.onrender.com/api/v1
        run: |
          cd frontend
          npm run build
          cp dist/index.html dist/404.html

      - name: Publish to Cloud Static Hosting (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: ""
